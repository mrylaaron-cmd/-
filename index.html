<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Tio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SCREEN 1 -->
    <section id="start-screen" class="screen active">
        <div class="start-content">
            <h1>FOR MY TIO</h1>
            <p class="blink">CLICK ANYWHERE</p>
        </div>
    </section>


    <!-- SCREEN 2 -->
    <section id="password-screen" class="screen">
        <div class="password-box">

            <p class="small-text">THIS MESSAGE IS LOCKED.</p>

            <h2>ENTER PASSWORD</h2>

            <input
                type="password"
                id="password-input"
                autocomplete="off"
                placeholder="********"
            >

            <button id="submit-password">ENTER</button>

            <p id="password-error"></p>

        </div>
    </section>


    <!-- SCREEN 3 -->
    <section id="letter-screen" class="screen">

        <div class="letter-window">

            <div class="window-header">
                <span>MESSAGE.EXE</span>
                <span>♥</span>
            </div>

            <div class="letter-content">
                <p id="letter-text">
                    YOUR LETTER WILL GO HERE.
                </p>
            </div>

        </div>

    </section>


    <!-- MUSIC -->
    <audio id="background-music" loop>
        <source src="Same dream, same mind, same night.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
